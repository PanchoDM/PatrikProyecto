<div class="login-shell d-flex align-items-center justify-content-center">
  <div class="card fade-in p-4 p-md-5" style="max-width: 420px; width: 100%;">
    <div class="text-center mb-4">
      <i class="bi bi-broadcast display-5 text-primary"></i>
      <h1 class="h4 mt-3 mb-1">KPI</h1>
      <p class="text-body-secondary small mb-0">Acceso de operadores y supervisores</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Correo</label>
        <input
          id="email"
          type="email"
          class="form-control form-control-lg"
          formControlName="email"
          autocomplete="username"
        />
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Contrasena</label>
        <input
          id="password"
          type="password"
          class="form-control form-control-lg"
          formControlName="password"
          autocomplete="current-password"
        />
      </div>

      @if (errorMessage()) {
        <div class="alert alert-danger py-2 small">{{ errorMessage() }}</div>
      }

      <button type="submit" class="btn btn-primary btn-action w-100" [disabled]="form.invalid || submitting()">
        @if (submitting()) {
          <span class="spinner-border spinner-border-sm me-2"></span>
        }
        Ingresar
      </button>
    </form>
  </div>
</div>
